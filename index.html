<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Oasis · Metaverse Games on KleverChain</title>
<meta name="description" content="A growing collection of action games on KleverChain. Play, earn, trade, and stake — all from one wallet." />

<!-- React 18 + Babel for JSX in the browser, no build step -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Open-source fonts only -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
:root {
  --bg-deep:  #06060f;
  --bg-mid:   #0e0820;
  --bg-card:  #150a30;
  --purple:   #7c3aed;
  --purple-l: #a78bfa;
  --purple-d: #4A1A8A;
  --gold:     #f59e0b;
  --gold-l:   #fbbf24;
  --text:     #e2e8f0;
  --muted:    #94a3b8;
  --danger:   #ef4444;
  --success:  #22c55e;
  --cyan:     #22d3ee;
  --green:    #4ade80;
  --pink:     #ec4899;
  --max-w: 1240px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(ellipse at 50% -10%, rgba(124,58,237,0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 20%, rgba(245,158,11,0.06) 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
  color: var(--text);
  font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: 'Cinzel', serif; letter-spacing: 0.04em; }
.mono { font-family: 'JetBrains Mono', monospace; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--purple), var(--purple-d));
  border-radius: 3px;
}

a { color: inherit; text-decoration: none; }
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button:active { transform: scale(0.98); }

.container { max-width: var(--max-w); margin: 0 auto; padding: 0 24px; }

/* ── Header ────────────────────────────────────────────────────────────── */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background:
    linear-gradient(180deg, rgba(14,8,32,0.92) 0%, rgba(14,8,32,0.78) 100%);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(124,58,237,0.25);
}
.app-header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 14px 24px;
  max-width: var(--max-w);
  margin: 0 auto;
  position: relative;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}
.brand-mark {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--purple) 0%, var(--gold) 100%);
  position: relative;
  box-shadow: 0 0 18px rgba(124,58,237,0.45);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 1.1rem;
}
.brand-text {
  font-family: 'Cinzel', serif;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.32em;
  background: linear-gradient(90deg, var(--gold) 0%, var(--purple-l) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.nav { display: flex; gap: 6px; align-items: center; }
.nav-btn {
  padding: 6px 14px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border-radius: 999px;
  color: var(--muted);
  transition: color 0.18s, background 0.18s;
}
.nav-btn:hover { color: var(--text); background: rgba(124,58,237,0.10); }
.nav-btn.active {
  color: var(--gold);
  background: rgba(245,158,11,0.10);
  box-shadow: 0 0 0 1px rgba(245,158,11,0.3) inset;
}
.header-right { display: flex; align-items: center; gap: 10px; }

.wallet-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(124,58,237,0.18);
  border: 1px solid rgba(124,58,237,0.4);
  color: var(--text);
  padding: 6px 14px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  border-radius: 999px;
  transition: all 0.18s;
}
.wallet-pill:hover { border-color: var(--gold); background: rgba(124,58,237,0.32); }
.wallet-pill.connected { border-color: rgba(34,197,94,0.5); background: rgba(34,197,94,0.10); }
.wallet-pill .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted);
}
.wallet-pill.connected .dot { background: var(--success); box-shadow: 0 0 6px var(--success); }
.wallet-pill .addr { color: var(--gold); font-weight: 700; }

.menu-btn {
  display: none;
  width: 36px; height: 36px;
  border-radius: 8px;
  background: rgba(124,58,237,0.2);
  border: 1px solid rgba(124,58,237,0.4);
  color: var(--text);
  font-size: 1.2rem;
  align-items: center;
  justify-content: center;
}
@media (max-width: 760px) {
  .nav { display: none; }
  .menu-btn { display: flex; }
  .nav.mobile-open {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: rgba(14,8,32,0.96);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(124,58,237,0.3);
    padding: 12px;
    gap: 4px;
  }
  .nav.mobile-open .nav-btn { padding: 12px; text-align: left; border-radius: 6px; }
  .brand-text { font-size: 0.95rem; letter-spacing: 0.22em; }
}

/* ── Hero ──────────────────────────────────────────────────────────────── */
.hero {
  position: relative;
  padding: 80px 24px 100px;
  text-align: center;
  overflow: hidden;
}
.hero canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0.7;
}
.hero-inner { position: relative; max-width: 920px; margin: 0 auto; }
.eyebrow {
  display: inline-block;
  padding: 5px 14px;
  background: rgba(245,158,11,0.10);
  border: 1px solid rgba(245,158,11,0.35);
  color: var(--gold);
  font-size: 0.7rem;
  letter-spacing: 0.32em;
  border-radius: 999px;
  font-weight: 600;
  text-transform: uppercase;
}
.hero h1 {
  font-size: clamp(2.4rem, 6vw, 4.6rem);
  letter-spacing: 0.05em;
  margin: 18px 0 12px;
  line-height: 1.05;
  background: linear-gradient(180deg, #ffffff 0%, var(--gold-l) 60%, var(--purple-l) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 40px rgba(124,58,237,0.25);
}
.hero p.lede {
  font-size: clamp(1rem, 2vw, 1.25rem);
  color: var(--muted);
  max-width: 620px;
  margin: 0 auto;
  line-height: 1.6;
}
.hero-cta {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 32px;
  flex-wrap: wrap;
}

.btn-primary, .btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 28px;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.9rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-radius: 6px;
  transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--purple), var(--purple-d));
  color: #fff;
  border: 1px solid rgba(245,158,11,0.4);
  box-shadow: 0 6px 24px rgba(124,58,237,0.4);
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--gold), var(--purple));
  box-shadow: 0 8px 36px rgba(245,158,11,0.5);
  transform: translateY(-2px);
}
.btn-ghost {
  background: rgba(124,58,237,0.10);
  border: 1px solid rgba(124,58,237,0.4);
  color: var(--text);
}
.btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

/* ── Stats strip ──────────────────────────────────────────────────────── */
.stats-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 18px;
  margin: 30px auto 60px;
  max-width: var(--max-w);
  padding: 0 24px;
}
.stat-cell {
  background: rgba(14,8,32,0.6);
  border: 1px solid rgba(124,58,237,0.22);
  border-radius: 10px;
  padding: 18px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.stat-cell::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.5;
}
.stat-num {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.6rem, 3vw, 2.2rem);
  color: var(--gold-l);
  font-weight: 700;
  text-shadow: 0 0 22px rgba(245,158,11,0.35);
}
.stat-label {
  color: var(--muted);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 4px;
}

/* ── Section ──────────────────────────────────────────────────────────── */
section.app-section {
  padding: 60px 24px 80px;
  max-width: var(--max-w);
  margin: 0 auto;
}
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 18px;
  margin-bottom: 32px;
}
.section-head h2 {
  font-size: clamp(1.6rem, 3vw, 2.2rem);
  background: linear-gradient(90deg, var(--gold-l), var(--purple-l));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.section-head p {
  color: var(--muted);
  margin-top: 6px;
  max-width: 520px;
  font-size: 0.95rem;
}

/* ── Game cards ────────────────────────────────────────────────────────── */
.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}
.game-card {
  background: linear-gradient(160deg, rgba(124,58,237,0.18), rgba(14,8,32,0.85));
  border: 1px solid rgba(124,58,237,0.32);
  border-radius: 14px;
  overflow: hidden;
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  position: relative;
}
.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
  box-shadow: 0 12px 36px rgba(124,58,237,0.4), 0 0 22px rgba(245,158,11,0.18);
}
.game-card.coming { opacity: 0.55; }
.game-card.coming:hover { transform: none; border-color: rgba(124,58,237,0.32); box-shadow: none; cursor: default; }

.card-preview {
  height: 180px;
  position: relative;
  overflow: hidden;
  background: var(--bg-mid);
}
.card-preview canvas { width: 100%; height: 100%; display: block; }
.card-status {
  position: absolute;
  top: 10px; left: 10px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.card-status.live { background: rgba(34,197,94,0.18); border: 1px solid rgba(34,197,94,0.55); color: var(--green); box-shadow: 0 0 8px rgba(34,197,94,0.5); }
.card-status.beta { background: rgba(34,211,238,0.18); border: 1px solid rgba(34,211,238,0.55); color: var(--cyan); }
.card-status.soon { background: rgba(124,58,237,0.18); border: 1px solid rgba(124,58,237,0.55); color: var(--purple-l); }
.card-token {
  position: absolute;
  top: 10px; right: 10px;
  padding: 3px 10px;
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  font-weight: 700;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(245,158,11,0.4);
  color: var(--gold);
}
.card-body { padding: 18px 18px 20px; flex: 1; display: flex; flex-direction: column; }
.card-body h3 {
  font-size: 1.4rem;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
  color: var(--text);
}
.card-body .tag {
  color: var(--muted);
  font-size: 0.85rem;
  margin-bottom: 14px;
  flex: 1;
  line-height: 1.45;
}
.card-genre { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
.genre-pill {
  font-size: 0.66rem;
  padding: 2px 8px;
  background: rgba(124,58,237,0.16);
  border: 1px solid rgba(124,58,237,0.3);
  border-radius: 999px;
  color: var(--purple-l);
  letter-spacing: 0.05em;
}
.card-actions { display: flex; gap: 8px; }
.card-actions .btn-primary, .card-actions .btn-ghost {
  flex: 1; padding: 10px; font-size: 0.78rem; letter-spacing: 0.12em; text-align: center; justify-content: center;
}

/* ── Panel ─────────────────────────────────────────────────────────────── */
.panel {
  background: linear-gradient(160deg, rgba(124,58,237,0.10), rgba(14,8,32,0.85));
  border: 1px solid rgba(124,58,237,0.28);
  border-radius: 14px;
  padding: 24px;
}

.tok-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(124,58,237,0.32);
  border-radius: 999px;
  padding: 5px 12px 5px 5px;
  font-weight: 700;
  font-size: 0.86rem;
  cursor: pointer;
  transition: border-color 0.18s;
}
.tok-pill:hover { border-color: var(--gold); }
.tok-icon {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 0.65rem;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 0 8px rgba(0,0,0,0.5);
}

/* ── Swap ──────────────────────────────────────────────────────────────── */
.swap { max-width: 480px; margin: 0 auto; }
.swap-cell {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(124,58,237,0.22);
  border-radius: 12px;
  padding: 16px;
}
.swap-cell .row1 {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
}
.swap-cell .row2 { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
.swap-input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 1.8rem;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  outline: none;
  width: 0;
  min-width: 0;
}
.swap-flip {
  margin: -8px auto;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 2px solid rgba(245,158,11,0.4);
  display: flex; align-items: center; justify-content: center;
  color: var(--gold);
  font-size: 1rem;
  z-index: 1;
  position: relative;
  transition: transform 0.3s;
}
.swap-flip:hover { transform: rotate(180deg); border-color: var(--gold); }
.swap-summary {
  margin-top: 14px;
  padding: 10px 14px;
  background: rgba(245,158,11,0.06);
  border: 1px solid rgba(245,158,11,0.18);
  border-radius: 8px;
  font-size: 0.82rem;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 18px;
}
.swap-summary strong { color: var(--gold); }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 4px 10px;
  font-size: 0.74rem;
  border-radius: 999px;
  background: rgba(124,58,237,0.14);
  border: 1px solid rgba(124,58,237,0.28);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.chip.active {
  background: rgba(245,158,11,0.18);
  border-color: var(--gold);
  color: var(--gold);
}

/* ── Pools ─────────────────────────────────────────────────────────────── */
.pools-list { display: flex; flex-direction: column; gap: 12px; }
.pool-row {
  display: grid;
  grid-template-columns: minmax(0, 2.2fr) 1fr 1fr 1fr auto;
  gap: 14px;
  align-items: center;
  background: linear-gradient(160deg, rgba(124,58,237,0.08), rgba(14,8,32,0.85));
  border: 1px solid rgba(124,58,237,0.22);
  border-radius: 12px;
  padding: 16px 18px;
  transition: all 0.18s;
}
.pool-row:hover { border-color: rgba(245,158,11,0.45); box-shadow: 0 0 18px rgba(124,58,237,0.18); }
.pool-pair { display: flex; align-items: center; gap: 10px; }
.pool-pair .icons { display: flex; }
.pool-pair .icons .tok-icon:nth-child(2) { margin-left: -8px; border: 2px solid var(--bg-card); }
.pool-pair .label { font-weight: 700; }
.pool-stat { text-align: right; }
.pool-stat .v { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--text); font-size: 0.95rem; }
.pool-stat .l { font-size: 0.66rem; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; }
.pool-row .add-btn {
  background: rgba(245,158,11,0.18);
  border: 1px solid rgba(245,158,11,0.4);
  color: var(--gold);
  padding: 8px 14px;
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  border-radius: 6px;
  text-transform: uppercase;
  transition: all 0.18s;
}
.pool-row .add-btn:hover { background: rgba(245,158,11,0.32); border-color: var(--gold); }

@media (max-width: 760px) {
  .pool-row { grid-template-columns: 1fr 1fr; }
  .pool-row .pool-pair { grid-column: 1 / -1; }
  .pool-row .add-btn { grid-column: 1 / -1; width: 100%; padding: 10px; }
}

/* ── Wallet ────────────────────────────────────────────────────────────── */
.wallet-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
@media (max-width: 760px) { .wallet-grid { grid-template-columns: 1fr; } }
.kda-list { display: flex; flex-direction: column; gap: 10px; }
.kda-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(124,58,237,0.18);
  border-radius: 10px;
  padding: 12px 14px;
}
.kda-row .left { display: flex; align-items: center; gap: 10px; }
.kda-row .amt { font-family: 'JetBrains Mono', monospace; font-weight: 700; }

/* ── Activity feed ─────────────────────────────────────────────────────── */
.feed-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(124,58,237,0.12);
  font-size: 0.85rem;
}
.feed-row:last-child { border-bottom: none; }
.feed-row .who { font-family: 'JetBrains Mono', monospace; color: var(--purple-l); font-size: 0.78rem; }
.feed-row .what { flex: 1; padding: 0 12px; }
.feed-row .when { color: var(--muted); font-size: 0.72rem; }

/* ── Modal ─────────────────────────────────────────────────────────────── */
.modal-back {
  position: fixed; inset: 0;
  background: rgba(6,6,15,0.75);
  backdrop-filter: blur(6px);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  animation: fadeIn 0.2s ease;
}
.modal-card {
  background: linear-gradient(160deg, rgba(28,16,52,0.96), rgba(14,8,32,0.96));
  border: 1px solid rgba(124,58,237,0.4);
  border-radius: 14px;
  max-width: 460px;
  width: 100%;
  padding: 24px;
  position: relative;
  animation: pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.modal-x {
  position: absolute; top: 12px; right: 12px;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: rgba(124,58,237,0.2);
  border: 1px solid rgba(245,158,11,0.4);
  color: var(--gold);
  font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}

/* ── Footer ────────────────────────────────────────────────────────────── */
.app-footer {

/* ── Klever wallet helper ─────────────────────────────────────────────── */
const KLEVER = {
  address: null,
  klvBalance: 0,
  kdaAssets: {},
  isInstalled() { return typeof window !== 'undefined' && !!(window.klever || window.kleverWeb); },
  shortAddress(a) { if (!a) return ''; return a.slice(0,6) + '…' + a.slice(-4); },
  _provider() {
    if (typeof window === 'undefined') return null;
    if (window.klever)    return { kind: 'extension', api: window.klever };
    if (window.kleverWeb) return { kind: 'k5',        api: window.kleverWeb };
    return null;
  },
  isInK5() { return typeof navigator !== 'undefined' && /Klever|K5/i.test(navigator.userAgent); },
  async connect() {
    const p = this._provider();
    if (!p) {
      if (this.isInK5()) throw new Error('K5 wallet not ready — refresh the page');
      window.open('https://klever.io/klever-wallet', '_blank');
      throw new Error('Klever Wallet not installed');
    }
    let address;
    if (p.kind === 'extension') {
      if (typeof p.api.initialize === 'function') await p.api.initialize();
      const acc = await p.api.getAccount();
      address = acc && acc.address;
    } else {
      address = p.api.address || p.api.walletAddress;
      if (!address && typeof p.api.getWalletAddress === 'function') address = await p.api.getWalletAddress();
      if (!address && typeof p.api.requestAccounts === 'function') {
        const accs = await p.api.requestAccounts();
        address = Array.isArray(accs) ? accs[0] : (accs && accs.address);
      }
    }
    if (!address) throw new Error('No address returned');
    this.address = address;
    await this.refresh();
    return address;
  },
  async refresh() {
    if (!this.address) return;
    try {
      const res = await fetch(`https://api.mainnet.klever.org/v1.0/address/${this.address}`, { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      const acc = data && data.data && data.data.account;
      if (acc) {
        const raw = typeof acc.balance === 'string' ? parseFloat(acc.balance) : (acc.balance || 0);
        this.klvBalance = raw / 1_000_000;
        this.kdaAssets = acc.assets || {};
      }
    } catch (_) {}
  },
  disconnect() {
    this.address = null;
    this.klvBalance = 0;
    this.kdaAssets = {};
  },
};

function fmtNum(v, decimals = 2) {
  if (v == null || isNaN(v)) return '0';
  if (v === 0) return '0';
  if (v < 0.001) return v.toExponential(2);
  return v.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: decimals });
}
function fmtUSD(v) { return '$' + fmtNum(v, 2); }
function fmtCompact(v) {
  if (v >= 1_000_000) return (v / 1_000_000).toFixed(1) + 'M';
  if (v >= 1_000)     return (v / 1_000).toFixed(1)     + 'K';
  return fmtNum(v, 0);
}

/* ── Hero canvas backdrop — slow particle field ─────────────────────── */
function HeroBackdrop() {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    const ctx = canvas.getContext('2d');
    let raf;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      canvas.width = canvas.offsetWidth * dpr;
      canvas.height = canvas.offsetHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    const onResize = () => resize();
    window.addEventListener('resize', onResize);
    const N = 60;
    const pts = Array.from({ length: N }, () => ({
      x: Math.random() * canvas.offsetWidth,
      y: Math.random() * canvas.offsetHeight,
      vx: (Math.random() - 0.5) * 0.18,
      vy: (Math.random() - 0.5) * 0.18,
      r: 0.6 + Math.random() * 1.6,
      hue: Math.random() < 0.6 ? 270 : 38,
    }));
    function loop() {
      const w = canvas.offsetWidth, h = canvas.offsetHeight;
      ctx.fillStyle = 'rgba(6,6,15,0.18)';
      ctx.fillRect(0, 0, w, h);
      ctx.lineWidth = 0.5;
      for (let i = 0; i < N; i++) {
        const a = pts[i];
        for (let j = i + 1; j < N; j++) {
          const b = pts[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d2 = dx*dx + dy*dy;
          if (d2 < 13_000) {
            const alpha = 0.18 * (1 - d2 / 13_000);
            ctx.strokeStyle = `rgba(167,139,250,${alpha})`;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
      for (const p of pts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10; if (p.y > h + 10) p.y = -10;
        ctx.fillStyle = `hsla(${p.hue}, 90%, 70%, 0.85)`;
        ctx.shadowColor = `hsl(${p.hue}, 90%, 70%)`;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); };
  }, []);
  return <canvas ref={ref}></canvas>;
}

/* ── Per-game preview animations ─────────────────────────────────────── */
function GamePreview({ kind, palette }) {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    const ctx = canvas.getContext('2d');
    let raf, t = 0;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      canvas.width = canvas.offsetWidth * dpr;
      canvas.height = canvas.offsetHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    const onResize = () => resize();
    window.addEventListener('resize', onResize);

    function loop() {
      t += 0.016;
      const w = canvas.offsetWidth, h = canvas.offsetHeight;
      ctx.clearRect(0, 0, w, h);
      const grd = ctx.createLinearGradient(0, 0, 0, h);
      grd.addColorStop(0, palette[1] + '22');
      grd.addColorStop(1, '#06060f');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, w, h);

      if (kind === 'aetherdrift') {
        const cx = w * 0.5, cy = h * 0.55;
        for (let i = 0; i < 22; i++) {
          const ang = i * 0.5 + t * 0.6;
          const r = (i * 3 + 18 + Math.sin(t + i) * 6);
          const x = cx + Math.cos(ang) * r;
          const y = cy + Math.sin(ang) * r * 0.6;
          ctx.fillStyle = palette[(i + 1) % palette.length] + '88';
          ctx.beginPath(); ctx.arc(x, y, 2 + Math.sin(t + i) * 1, 0, Math.PI * 2); ctx.fill();
        }
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.4);
        ctx.fillStyle = palette[1];
        ctx.shadowColor = palette[1]; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(0, -10); ctx.lineTo(-10, 0); ctx.lineTo(0, 10); ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }
      else if (kind === 'shadowstep') {
        ctx.fillStyle = '#0a0420';
        ctx.fillRect(0, 0, w, h * 0.7);
        ctx.fillStyle = '#fde68a';
        ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(w * 0.78, h * 0.26, 16, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#0a0420';
        ctx.beginPath(); ctx.arc(w * 0.78 - 6, h * 0.23, 14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#150a30';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.7);
        for (let x = 0; x <= w + 20; x += 30) {
          ctx.lineTo(x, h * 0.7 - (Math.sin(x * 0.04 + t * 0.3) * 18 + 26));
        }
        ctx.lineTo(w, h); ctx.lineTo(0, h);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#1a1410';
        ctx.fillRect(0, h * 0.85, w, h * 0.15);
        const px = w * 0.5 + Math.sin(t * 1.2) * 6;
        const py = h * 0.85 - 22 + Math.abs(Math.sin(t * 6)) * 1;
        ctx.fillStyle = '#0c0512';
        ctx.fillRect(px - 4, py - 18, 8, 18);
        ctx.fillRect(px - 5, py - 22, 10, 5);
        ctx.fillStyle = palette[1];
        ctx.fillRect(px - 5, py - 14, 10, 1.5);
        ctx.fillStyle = '#fde68a';
        ctx.fillRect(px + 1, py - 21, 1.5, 1);
        for (let i = 0; i < 14; i++) {
          const px2 = ((i * 41 + t * 30) % (w + 20)) - 10;
          const py2 = ((i * 23 + t * 70) % (h + 20)) - 10;
          ctx.fillStyle = '#f5b7c4cc';
          ctx.beginPath();
          ctx.ellipse(px2, py2, 2, 1.2, t + i, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      else if (kind === 'vault') {
        ctx.fillStyle = palette[0] + '20';
        ctx.fillRect(0, h * 0.6, w, h * 0.4);
        ctx.strokeStyle = palette[0]; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(w / 2, h * 0.65, w * 0.4, h * 0.18, 0, 0, Math.PI * 2);
        ctx.stroke();
        for (let i = 0; i < 5; i++) {
          const cx = (i / 4) * (w - 100) + 50;
          const cy = h * 0.62 + Math.sin(t * 1.4 + i) * 4;
          ctx.fillStyle = ['#ef4444','#fbbf24','#4ade80','#22d3ee','#a78bfa'][i];
          ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
          ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
        }
        const fx = (t * 80) % (w + 30) - 15;
        const fy = h * 0.5 + (((t * 60) % h) || 0);
        ctx.fillStyle = '#fbbf24';
        ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(fx, fy, 7, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
      else if (kind === 'forge') {
        const cols = 5, rows = 3;
        const cw = w / cols, ch = h / rows;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const i = r * cols + c;
            const cx = c * cw + cw / 2;
            const cy = r * ch + ch / 2 + Math.sin(t + i) * 2;
            const color = palette[i % palette.length];
            ctx.fillStyle = color;
            ctx.shadowColor = color; ctx.shadowBlur = 8;
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4);
            ctx.fillRect(-7, -7, 14, 14);
            ctx.restore();
            ctx.shadowBlur = 0;
          }
        }
      }
      else if (kind === 'echo') {
        ctx.fillStyle = palette[2];
        ctx.beginPath();
        ctx.moveTo(0, h);
        ctx.lineTo(w * 0.3, h * 0.3);
        ctx.lineTo(w * 0.5, h * 0.6);
        ctx.lineTo(w * 0.7, h * 0.25);
        ctx.lineTo(w, h);
        ctx.closePath(); ctx.fill();
        const cy = h - 26;
        for (let i = -2; i <= 2; i++) {
          const ang = i * 0.18 + Math.sin(t + i) * 0.04;
          ctx.save();
          ctx.translate(w / 2 + i * 18, cy);
          ctx.rotate(ang);
          ctx.fillStyle = '#0e0820';
          ctx.fillRect(-10, -32, 20, 30);
          ctx.strokeStyle = palette[Math.abs(i) % palette.length];
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-10, -32, 20, 30);
          ctx.fillStyle = palette[Math.abs(i) % palette.length];
          ctx.beginPath(); ctx.arc(0, -22, 3, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      }
      else if (kind === 'frontier') {
        const cx = w / 2, cy = h * 0.6;
        ctx.fillStyle = palette[0];
        ctx.fillRect(cx - 18, cy - 10, 36, 22);
        ctx.fillRect(cx - 10, cy - 22, 20, 12);
        ctx.fillStyle = palette[1];
        ctx.fillRect(cx - 6, cy - 18, 12, 3);
        const swing = Math.sin(t * 4) * 3;
        ctx.fillStyle = palette[0];
        ctx.fillRect(cx - 16, cy + 12, 8, 14 + swing);
        ctx.fillRect(cx + 8,  cy + 12, 8, 14 - swing);
        ctx.fillStyle = palette[2];
        ctx.fillRect(cx + 14, cy - 4, 20, 6);
        if ((Math.sin(t * 2.5) + 1) > 1.2) {
          ctx.fillStyle = '#fbbf24';
          ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 14;
          ctx.beginPath(); ctx.arc(cx + 36, cy - 1, 5, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
      else if (kind === 'neondrift') {
        // synthwave horizon
        const horY = h * 0.55;
        const skyG = ctx.createLinearGradient(0, 0, 0, horY);
        skyG.addColorStop(0, '#1a0428');
        skyG.addColorStop(1, palette[0]);
        ctx.fillStyle = skyG;
        ctx.fillRect(0, 0, w, horY);
        // sun
        const sunR = h * 0.18;
        const sunG = ctx.createLinearGradient(0, horY - sunR, 0, horY + sunR);
        sunG.addColorStop(0, '#fde047'); sunG.addColorStop(0.5, '#ff7e9d'); sunG.addColorStop(1, palette[0]);
        ctx.fillStyle = sunG;
        ctx.beginPath(); ctx.arc(w / 2, horY, sunR, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#1a0428';
        for (let i = 0; i < 5; i++) ctx.fillRect(w/2 - sunR, horY - sunR*0.2 + i*sunR*0.16, sunR*2, 2 + i);
        // road grid
        ctx.strokeStyle = palette[1] + 'aa';
        ctx.lineWidth = 1;
        const offset = (t * 30) % 30;
        for (let i = 0; i < 8; i++) {
          const py = horY + i * ((h - horY) / 8) - offset / (i + 1);
          ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(w, py); ctx.stroke();
        }
        // road sides converging
        ctx.beginPath();
        ctx.moveTo(w * 0.5, horY);
        ctx.lineTo(0, h);
        ctx.moveTo(w * 0.5, horY);
        ctx.lineTo(w, h);
        ctx.stroke();
        // car
        const cx = w * 0.5 + Math.sin(t) * 20;
        const cy = h * 0.85;
        ctx.fillStyle = palette[0];
        ctx.shadowColor = palette[0]; ctx.shadowBlur = 14;
        ctx.fillRect(cx - 14, cy - 7, 28, 14);
        ctx.shadowBlur = 0;
        ctx.fillStyle = palette[2];
        ctx.fillRect(cx - 12, cy - 1, 24, 3);
      }
      else if (kind === 'pulseforge') {
        // 4 lanes converging toward the bottom
        const laneW = w / 4;
        const colors = palette;
        for (let i = 0; i < 4; i++) {
          const lx = i * laneW;
          const g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, '#06030f00');
          g.addColorStop(0.7, colors[i % colors.length] + '22');
          g.addColorStop(1, colors[i % colors.length] + '66');
          ctx.fillStyle = g;
          ctx.fillRect(lx, 0, laneW, h);
          ctx.fillStyle = colors[i % colors.length] + '55';
          ctx.fillRect(lx, 0, 1, h);
        }
        // strike line
        const sy = h * 0.78;
        const sg = ctx.createLinearGradient(0, sy, w, sy);
        sg.addColorStop(0, palette[0]);
        sg.addColorStop(0.5, palette[1]);
        sg.addColorStop(1, palette[2]);
        ctx.strokeStyle = sg;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(w, sy); ctx.stroke();
        // falling notes
        const notesT = (t * 0.9) % 1;
        for (let i = 0; i < 6; i++) {
          const phase = ((notesT + i * 0.17) % 1);
          const lane = (i * 3 + 1) % 4;
          const ny = phase * sy;
          const nx = lane * laneW + laneW / 2;
          const nw = laneW * 0.7, nh = 6;
          ctx.fillStyle = colors[lane % colors.length];
          ctx.shadowColor = colors[lane % colors.length]; ctx.shadowBlur = 8;
          ctx.fillRect(nx - nw / 2, ny - nh / 2, nw, nh);
          ctx.shadowBlur = 0;
        }
        // pulse ring
        const pulse = (Math.sin(t * 4) + 1) / 2;
        ctx.strokeStyle = palette[0] + Math.floor(pulse * 200).toString(16).padStart(2, '0');
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(w / 2, h * 0.32, 30 + pulse * 14, 0, Math.PI * 2);
        ctx.stroke();
      }
      else if (kind === 'towersigil') {
        // path
        ctx.strokeStyle = palette[1] + '88';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(0, h * 0.55);
        ctx.lineTo(w * 0.3, h * 0.55);
        ctx.lineTo(w * 0.3, h * 0.30);
        ctx.lineTo(w * 0.7, h * 0.30);
        ctx.lineTo(w * 0.7, h * 0.75);
        ctx.lineTo(w, h * 0.75);
        ctx.stroke();
        // tower
        const tx = w * 0.5, ty = h * 0.55;
        ctx.fillStyle = palette[0];
        ctx.shadowColor = palette[0]; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(tx, ty, 12, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fde047';
        // bolt
        ctx.beginPath();
        ctx.moveTo(tx - 3, ty - 8); ctx.lineTo(tx + 4, ty - 1); ctx.lineTo(tx, ty); ctx.lineTo(tx + 3, ty + 8); ctx.lineTo(tx - 4, ty + 1); ctx.lineTo(tx, ty); ctx.closePath();
        ctx.fill();
        // enemies along path
        for (let i = 0; i < 3; i++) {
          const phase = (t * 0.3 + i * 0.33) % 1;
          // approximate position along path (5 segments)
          let px, py;
          if (phase < 0.18) { px = phase / 0.18 * w * 0.3; py = h * 0.55; }
          else if (phase < 0.30) { px = w * 0.3; py = h * 0.55 - (phase - 0.18) / 0.12 * h * 0.25; }
          else if (phase < 0.55) { px = w * 0.3 + (phase - 0.30) / 0.25 * w * 0.4; py = h * 0.30; }
          else if (phase < 0.75) { px = w * 0.7; py = h * 0.30 + (phase - 0.55) / 0.20 * h * 0.45; }
          else { px = w * 0.7 + (phase - 0.75) / 0.25 * w * 0.3; py = h * 0.75; }
          ctx.fillStyle = palette[2];
          ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
        }
        // pulse ring (range)
        ctx.strokeStyle = palette[0] + '44';
        ctx.lineWidth = 1;
        const ringR = 30 + Math.sin(t * 3) * 6;
        ctx.beginPath(); ctx.arc(tx, ty, ringR, 0, Math.PI * 2); ctx.stroke();
      }
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); };
  }, [kind, palette]);
  return <canvas ref={ref}></canvas>;
}

function StatCell({ label, value, fmt = 'num' }) {
  const [shown, setShown] = useState(0);
  useEffect(() => {
    let raf;
    const start = performance.now();
    const dur = 1200;
    function loop(now) {
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      setShown(value * eased);
      if (t < 1) raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  const display = fmt === 'usd' ? fmtUSD(shown)
                : fmt === 'compact' ? fmtCompact(shown)
                : fmt === 'pct' ? fmtNum(shown, 1) + '%'
                : fmtNum(shown, 0);
  return (
    <div className="stat-cell">
      <div className="stat-num">{display}</div>
      <div className="stat-label">{label}</div>
    </div>
  );
}

function Exchange({ wallet, toast }) {
  const [fromId, setFromId] = useState('KLV');
  const [toId, setToId]     = useState('OASIS-DRIFT');
  const [amount, setAmount] = useState('');
  const [slippage, setSlippage] = useState(0.5);
  const [pickFor, setPickFor] = useState(null);

  const from = tokenById(fromId);
  const to = tokenById(toId);
  const amtNum = parseFloat(amount) || 0;
  const grossOut = amtNum * (from.priceUsd / to.priceUsd);
  const fee = grossOut * 0.003;
  const out = grossOut - fee;
  const minOut = out * (1 - slippage / 100);
  const priceImpact = (Math.min(amtNum / 10000, 1) * 1.4).toFixed(2);

  function flip() { setFromId(toId); setToId(fromId); }
  function setMax() {
    if (fromId === 'KLV' && wallet.address) setAmount(String(Math.max(0, wallet.klvBalance - 0.01)));
    else setAmount('1000');
  }
  function attemptSwap() {
    if (!wallet.address) { toast('Connect a Klever wallet to swap', 'error'); return; }
    if (amtNum <= 0) { toast('Enter an amount to swap', 'error'); return; }
    toast(`Swap intent queued: ${fmtNum(amtNum, 4)} ${fromId} → ${fmtNum(out, 4)} ${toId}`);
  }

  return (
    <div className="swap">
      <div className="swap-cell">
        <div className="row1">
          <span>From</span>
          <span>
            {wallet.address && fromId === 'KLV'
              ? <>Balance: <strong style={{color: COLORS.gold}}>{fmtNum(wallet.klvBalance, 4)}</strong> · <button style={{ color: COLORS.gold, fontSize: '0.7rem', textDecoration: 'underline' }} onClick={setMax}>MAX</button></>
              : 'Wallet not connected'}
          </span>
        </div>
        <div className="row2">
          <input
            type="text"
            inputMode="decimal"
            placeholder="0.0"
            value={amount}
            onChange={e => setAmount(e.target.value.replace(/[^0-9.]/g,''))}
            className="swap-input"
          />
          <button className="tok-pill" onClick={() => setPickFor('from')}>
            <TokenIcon id={fromId} />
            <span>{fromId}</span>
            <span style={{ color: COLORS.muted, fontSize: '0.85rem' }}>▾</span>
          </button>
        </div>
      </div>

      <div style={{ display: 'flex', justifyContent: 'center' }}>
        <button className="swap-flip" onClick={flip} title="Flip"><span>⇅</span></button>
      </div>

      <div className="swap-cell">
        <div className="row1"><span>To (estimated)</span><span>{fmtUSD(out * to.priceUsd)}</span></div>
        <div className="row2">
          <input
            type="text"
            placeholder="0.0"
            value={amtNum > 0 ? fmtNum(out, 4) : ''}
            readOnly
            className="swap-input"
            style={{ color: COLORS.purpleL }}
          />
          <button className="tok-pill" onClick={() => setPickFor('to')}>
            <TokenIcon id={toId} />
            <span>{toId}</span>
            <span style={{ color: COLORS.muted, fontSize: '0.85rem' }}>▾</span>
          </button>
        </div>
      </div>

      <div className="swap-summary">
        <span>Rate <strong>1 {fromId} ≈ {fmtNum(from.priceUsd / to.priceUsd, 6)} {toId}</strong></span>
        <span>Min received <strong>{fmtNum(minOut, 4)} {toId}</strong></span>
        <span>Price impact <strong style={{color: priceImpact > 1 ? COLORS.danger : COLORS.green}}>{priceImpact}%</strong></span>
        <span>LP fee <strong>{fmtNum(fee, 4)} {toId}</strong></span>
      </div>

      <div style={{ marginTop: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 8 }}>
          <span style={{ fontSize: '0.74rem', letterSpacing: '0.18em', color: COLORS.muted }}>SLIPPAGE</span>
          <div className="chip-row">
            {[0.1, 0.5, 1.0, 3.0].map(v => (
              <button key={v} className={'chip' + (slippage === v ? ' active' : '')} onClick={() => setSlippage(v)}>{v}%</button>
            ))}
          </div>
        </div>
      </div>

      <button
        className="btn-primary"
        onClick={attemptSwap}
        style={{ width: '100%', marginTop: 16, padding: '14px', justifyContent: 'center', fontSize: '1rem' }}
      >
        {wallet.address ? '↺ SWAP' : 'CONNECT WALLET TO SWAP'}
      </button>

      <p style={{ color: COLORS.muted, fontSize: '0.74rem', textAlign: 'center', marginTop: 14, lineHeight: 1.5 }}>
        Pricing routes through a mock pool until live Klever Swap integration ships. Min-received quote is final before signing.
      </p>

      {pickFor && <TokenSelectModal
        exclude={pickFor === 'from' ? toId : fromId}
        onPick={(id) => { if (pickFor === 'from') setFromId(id); else setToId(id); setPickFor(null); }}
        onClose={() => setPickFor(null)}
      />}
    </div>
  );
}

function ActivityFeed() {
  const [items, setItems] = useState(SAMPLE_FEED);
  useEffect(() => {
    const id = setInterval(() => {
      setItems(prev => {
        const next = [...prev];
        const last = next.pop();
        next.unshift({ ...last, when: 'just now' });
        return next.map((e, i) => ({
          ...e,
          when: i === 0 ? 'just now' : i === 1 ? '12s ago' : i === 2 ? '34s ago' : i === 3 ? '1m ago' : `${i + 1}m ago`,
        }));
      });
    }, 2500);
    return () => clearInterval(id);
  }, []);
  return (
    <div className="panel">
      <h3 style={{ color: COLORS.gold, marginBottom: 12, fontSize: '1.05rem' }}>Live Activity</h3>
      <div>
        {items.slice(0, 7).map((it, i) => (
          <div key={it.what + i} className="feed-row">
            <span className="who">{it.addr}</span>
            <span className="what">{it.what}</span>
            <span className="when">{it.when}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [section, setSection] = useState('home');
  const [wallet, setWallet] = useState({ address: KLEVER.address, klvBalance: 0, kdaAssets: {} });
  const [navOpen, setNavOpen] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);

  function showToast(msg, kind = 'ok') { setToastMsg({ msg, kind, id: Date.now() }); }
  useEffect(() => {
    if (!toastMsg) return;
    const t = setTimeout(() => setToastMsg(null), 3500);
    return () => clearTimeout(t);
  }, [toastMsg]);

  async function connect() {
    try {
      await KLEVER.connect();
      setWallet({ ...KLEVER });
      showToast('Wallet connected · ' + KLEVER.shortAddress(KLEVER.address));
    } catch (err) {
      showToast(err.message || 'Connect failed', 'error');
    }
  }
  async function refresh() {
    if (!KLEVER.address) return;
    await KLEVER.refresh();
    setWallet({ ...KLEVER });
  }
  function disconnect() {
    KLEVER.disconnect();
    setWallet({ address: null, klvBalance: 0, kdaAssets: {} });
    showToast('Disconnected');
  }
  function go(s) { setSection(s); setNavOpen(false); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  useEffect(() => {
    if (!wallet.address) return;
    const id = setInterval(refresh, 30_000);
    return () => clearInterval(id);
  }, [wallet.address]);

  return (
    <>
      <header className="app-header">
        <div className="app-header-inner">
          <div className="brand" onClick={() => go('home')}>
            <div className="brand-mark">⟆</div>
            <div className="brand-text">OASIS</div>
          </div>
          <nav className={'nav' + (navOpen ? ' mobile-open' : '')}>
            <button className={'nav-btn' + (section === 'home' ? ' active' : '')} onClick={() => go('home')}>Home</button>
            <button className={'nav-btn' + (section === 'games' ? ' active' : '')} onClick={() => go('games')}>Games</button>
            <button className={'nav-btn' + (section === 'exchange' ? ' active' : '')} onClick={() => go('exchange')}>Exchange</button>
            <button className={'nav-btn' + (section === 'pools' ? ' active' : '')} onClick={() => go('pools')}>Pools</button>
            <button className={'nav-btn' + (section === 'wallet' ? ' active' : '')} onClick={() => go('wallet')}>Wallet</button>
          </nav>
          <div className="header-right">
            <button
              className={'wallet-pill' + (wallet.address ? ' connected' : '')}
              onClick={wallet.address ? () => go('wallet') : connect}
            >
              <span className="dot"></span>
              {wallet.address
                ? <span><span className="addr">{KLEVER.shortAddress(wallet.address)}</span> · {fmtNum(wallet.klvBalance, 2)} KLV</span>
                : <span>Connect Klever</span>}
            </button>
            <button className="menu-btn" onClick={() => setNavOpen(o => !o)} aria-label="Menu">≡</button>
          </div>
        </div>
      </header>

      {section === 'home' && (
        <>
          <div className="hero">
            <HeroBackdrop />
            <div className="hero-inner">
              <span className="eyebrow">A growing metaverse on KleverChain</span>
              <h1>Play. Earn. Trade.</h1>
              <p className="lede">
                Oasis is a curated arcade of original action games — each one ships its own
                KDA reward token, plugged into a single shared exchange and liquidity layer.
                One wallet, every game, real on-chain ownership.
              </p>
              <div className="hero-cta">
                <button className="btn-primary" onClick={() => go('games')}>▶ ENTER ARCADE</button>
                <button className="btn-ghost" onClick={() => go('exchange')}>↻ EXCHANGE</button>
              </div>
            </div>
          </div>

          <div className="stats-strip">
            <StatCell label="Games Live"   value={9}      />
            <StatCell label="Games Coming" value={0}      />
            <StatCell label="Pools Active" value={POOLS.length} />
            <StatCell label="Total TVL"    value={POOLS.reduce((s,p) => s + p.tvl, 0)} fmt="usd" />
            <StatCell label="24h Volume"   value={POOLS.reduce((s,p) => s + p.vol24, 0)} fmt="usd" />
          </div>

          <section className="app-section" id="games">
            <div className="section-head">
              <div>
                <h2>Featured Games</h2>
                <p>Two live, four in the forge. Each game ships with its own reward token and a fully-on-chain progression layer.</p>
              </div>
              <button className="btn-ghost" onClick={() => go('games')}>VIEW ALL ↗</button>
            </div>
            <div className="games-grid">
              {GAMES.slice(0, 3).map(g => <GameCard key={g.id} game={g} />)}
            </div>
          </section>

          <section className="app-section">
            <div className="section-head">
              <div>
                <h2>Live Activity</h2>
                <p>Every swap, claim, and run is settled on KleverChain. Anonymized feed updates every few seconds.</p>
              </div>
            </div>
            <ActivityFeed />
          </section>
        </>
      )}

      {section === 'games' && (
        <section className="app-section">
          <div className="section-head">
            <div>
              <h2>The Arcade</h2>
              <p>All Oasis games — currently shipping and on the roadmap. Each launches in its own tab so you can keep this hub open in the background.</p>
            </div>
          </div>
          <div className="games-grid">
            {GAMES.map(g => <GameCard key={g.id} game={g} />)}
          </div>
        </section>
      )}

      {section === 'exchange' && (
        <section className="app-section">
          <div className="section-head">
            <div>
              <h2>Exchange</h2>
              <p>Swap KLV for any Oasis game token at the best route, or trade game tokens directly. Routing follows the highest-liquidity pool automatically.</p>
            </div>
          </div>
          <Exchange wallet={wallet} toast={showToast} />
        </section>
      )}

      {section === 'pools' && (
        <section className="app-section">
          <div className="section-head">
            <div>
              <h2>Liquidity Pools</h2>
              <p>Provide liquidity to earn 0.30% of every swap fee — paid in both pair tokens. APR includes accrued game-revenue rebates.</p>
            </div>
          </div>
          <Pools wallet={wallet} toast={showToast} />
        </section>
      )}

      {section === 'wallet' && (
        <section className="app-section">
          <div className="section-head">
            <div>
              <h2>Your Wallet</h2>
              <p>Live balance and KDA holdings on KleverChain. All values pulled from <span className="mono">api.mainnet.klever.org</span>.</p>
            </div>
            {wallet.address && (
              <button className="btn-ghost" onClick={disconnect} style={{ background: 'rgba(239,68,68,0.12)', borderColor: 'rgba(239,68,68,0.35)', color: COLORS.danger }}>
                DISCONNECT
              </button>
            )}
          </div>
          <WalletPanel wallet={wallet} refresh={refresh} toast={showToast} />
        </section>
      )}

      <footer className="app-footer">
        <div className="footer-inner">
          <div className="foot-col">
            <div className="brand" style={{ marginBottom: 12 }}>
              <div className="brand-mark">⟆</div>
              <div className="brand-text">OASIS</div>
            </div>
            <p style={{ color: COLORS.muted, fontSize: '0.86rem', maxWidth: 320 }}>
              An action-arcade metaverse, native to KleverChain. One wallet, every game, real on-chain ownership.
            </p>
          </div>
          <div className="foot-col">
            <h4>Games</h4>
            {GAMES.filter(g => g.status === 'live').map(g => (
              <a key={g.id} href={g.url} target="_blank" rel="noopener">{g.title} ↗</a>
            ))}
            <a onClick={() => go('games')}>All Games</a>
          </div>
          <div className="foot-col">
            <h4>Markets</h4>
            <a onClick={() => go('exchange')}>Exchange</a>
            <a onClick={() => go('pools')}>Liquidity Pools</a>
            <a onClick={() => go('wallet')}>Wallet</a>
          </div>
          <div className="foot-col">
            <h4>Resources</h4>
            <a target="_blank" rel="noopener" href="https://klever.io">Klever Wallet ↗</a>
            <a target="_blank" rel="noopener" href="https://kleverscan.org">Kleverscan ↗</a>
            <a target="_blank" rel="noopener" href="https://docs.klever.io">Klever Docs ↗</a>
          </div>
        </div>
        <div className="copyright">© 2026 Oasis · Built on KleverChain</div>
      </footer>

      {toastMsg && <div className={'toast' + (toastMsg.kind === 'error' ? ' error' : '')}>{toastMsg.msg}</div>}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
