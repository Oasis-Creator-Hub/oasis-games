<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<title>Shadow Realm | Oasis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{height:100%;overflow:hidden;background:#0a0a1a;color:#e2e8f0;font-family:system-ui;position:fixed;width:100%;}
#wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;}
#topbar{height:40px;background:rgba(124,58,237,0.12);border-bottom:1px solid rgba(124,58,237,0.25);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;z-index:10;}
#topbar .t{font-size:13px;color:#c084fc;letter-spacing:2px;flex:1;font-weight:700;}
#topbar .s{font-size:11px;color:#f59e0b;font-weight:700;}
#zones{height:32px;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;z-index:10;}
.zbtn{padding:3px 12px;border-radius:14px;border:1px solid rgba(124,58,237,0.3);background:transparent;color:#94a3b8;font-size:10px;font-weight:600;cursor:pointer;}
.zbtn.on{background:rgba(124,58,237,0.25);color:#c084fc;border-color:#7c3aed;}
#carea{flex:1;position:relative;overflow:hidden;}
canvas{width:100%;height:100%;display:block;}
#hud{position:absolute;top:6px;left:6px;right:6px;pointer-events:none;z-index:5;}
.bwrap{height:14px;background:rgba(0,0,0,0.6);border-radius:7px;margin-bottom:3px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);}
.bfill{height:100%;border-radius:7px;transition:width 0.3s;}
.bhp{background:linear-gradient(90deg,#ef4444,#f87171);}
.bmp{background:linear-gradient(90deg,#3b82f6,#60a5fa);}
.bxp{background:linear-gradient(90deg,#f59e0b,#fbbf24);}
.blbl{position:absolute;top:0;left:6px;right:6px;font-size:8px;font-weight:700;line-height:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.8);}
#tgt{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(10,10,26,0.85);border:1px solid #ef4444;border-radius:8px;padding:4px 12px;z-index:6;display:none;text-align:center;min-width:120px;}
#tgt .tn{font-size:11px;font-weight:700;color:#ef4444;}
#tgt .th{height:6px;background:#333;border-radius:3px;margin-top:3px;overflow:hidden;}
#tgt .thf{height:100%;background:#ef4444;border-radius:3px;transition:width 0.2s;}
#bar{height:60px;background:rgba(10,10,26,0.95);border-top:1px solid rgba(124,58,237,0.3);display:flex;align-items:center;justify-content:space-around;padding:0 4px;flex-shrink:0;z-index:10;}
.sk{width:48px;height:48px;border-radius:10px;border:2px solid rgba(124,58,237,0.5);background:rgba(124,58,237,0.12);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;-webkit-user-select:none;user-select:none;position:relative;}
.sk:active{background:rgba(124,58,237,0.35);transform:scale(0.95);}
.sk .i{font-size:18px;}
.sk .l{font-size:7px;color:#94a3b8;}
.sk .mp{position:absolute;bottom:1px;right:2px;font-size:6px;color:#60a5fa;}
#joy{position:absolute;bottom:70px;left:10px;width:80px;height:80px;z-index:8;}
#jbase{width:80px;height:80px;border-radius:50%;background:rgba(124,58,237,0.15);border:2px solid rgba(124,58,237,0.3);position:absolute;}
#jthumb{width:30px;height:30px;border-radius:50%;background:rgba(192,132,252,0.5);border:2px solid #c084fc;position:absolute;top:25px;left:25px;}
#mm{position:absolute;top:6px;right:6px;width:60px;height:60px;border-radius:50%;border:2px solid #7c3aed;overflow:hidden;background:rgba(10,10,26,0.7);z-index:7;}
#mmc{width:60px;height:60px;}
#inv{position:fixed;bottom:0;left:0;right:0;height:80vh;background:rgba(10,10,26,0.98);border-top:2px solid #7c3aed;z-index:100;overflow-y:auto;padding:10px;border-radius:14px 14px 0 0;display:none;}
#inv.open{display:block;}
#cls{position:fixed;inset:0;background:#0a0a1a;z-index:50;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;overflow-y:auto;}
#cls h1{color:#c084fc;font-size:22px;letter-spacing:4px;margin-top:20px;}
#cls p{color:#94a3b8;font-size:11px;}
.cc{width:80%;max-width:260px;padding:12px;border-radius:10px;border:2px solid rgba(124,58,237,0.3);background:rgba(124,58,237,0.08);cursor:pointer;display:flex;align-items:center;gap:12px;}
.cc:active{background:rgba(124,58,237,0.2);border-color:#7c3aed;}
.cc img{width:48px;height:80px;object-fit:contain;}
.cc .cn{font-size:14px;font-weight:700;color:#e2e8f0;}
.cc .cd{font-size:9px;color:#94a3b8;}
#go{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#go h1{color:#ef4444;font-size:26px;}
#go button{padding:10px 28px;border-radius:10px;border:2px solid #7c3aed;background:rgba(124,58,237,0.2);color:#c084fc;font-size:14px;font-weight:700;cursor:pointer;}
.df{position:fixed;pointer-events:none;font-weight:900;font-size:20px;z-index:15;animation:fu 0.8s ease-out forwards;text-shadow:0 0 6px rgba(0,0,0,0.8);}
@keyframes fu{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);}}
.lp{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,26,0.95);border:2px solid #f59e0b;border-radius:10px;padding:14px;z-index:30;text-align:center;animation:pi 0.3s ease;}
@keyframes pi{0%{transform:translate(-50%,-50%) scale(0.8);opacity:0;}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
#shop{position:fixed;bottom:0;left:0;right:0;height:35vh;background:rgba(10,10,26,0.98);border-top:2px solid #f59e0b;z-index:100;overflow-y:auto;padding:10px;border-radius:14px 14px 0 0;display:none;}
#shop.open{display:block;}
@media(orientation:landscape){.cc{width:45%;max-width:200px;padding:8px;} #cls{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-start;padding-top:8px;} #cls h1{width:100%;text-align:center;font-size:16px;margin:0;} #cls p{width:100%;text-align:center;}}
</style>
</head>
<body>
<div id="cls">
<h1>SHADOW REALM</h1>
<p>Choose your champion</p>
</div>
<div id="wrap" style="display:none;">
<div id="topbar"><span class="t">SHADOW REALM</span><span class="s" id="gd">0g</span><span class="s" id="lv">Lv1</span></div>
<div id="zones"><button class="zbtn on" onclick="chZone(0)">Forest</button><button class="zbtn" onclick="chZone(1)">Ruins</button><button class="zbtn" onclick="chZone(2)">Dragon</button></div>
<div id="carea"><canvas id="c"></canvas>
<div id="hud"><div style="position:relative"><div class="bwrap"><div class="bfill bhp" id="hpb" style="width:100%"></div></div><div class="blbl" id="hpt">HP</div></div>
<div style="position:relative"><div class="bwrap"><div class="bfill bmp" id="mpb" style="width:100%"></div></div><div class="blbl" id="mpt">MP</div></div>
<div style="position:relative"><div class="bwrap"><div class="bfill bxp" id="xpb" style="width:0%"></div></div><div class="blbl" id="xpt">XP</div></div></div>
<div id="tgt"><div class="tn" id="tgn"></div><div class="th"><div class="thf" id="tgh" style="width:100%"></div></div></div>
<div id="joy"><div id="jbase"></div><div id="jthumb"></div></div>
<div id="mm"><canvas id="mmc" width="60" height="60"></canvas></div>
</div>
<div id="bar"></div>
</div>
<div id="inv"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><b style="color:#c084fc;font-size:13px;">Equipment & Loot</b><button onclick="togInv()" style="width:32px;height:32px;border-radius:8px;border:1px solid #7c3aed;background:rgba(124,58,237,0.2);color:#c084fc;font-size:16px;cursor:pointer;">X</button></div><div id="ic"></div></div>
<div id="shop"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><b style="color:#f59e0b;font-size:13px;">Shop</b><button onclick="togShop()" style="width:32px;height:32px;border-radius:8px;border:1px solid #f59e0b;background:rgba(245,158,11,0.2);color:#f59e0b;font-size:16px;cursor:pointer;">X</button></div><div id="sc"></div></div>
<div id="go"><h1>YOU DIED</h1><p id="gs" style="color:#94a3b8;font-size:12px;"></p><button onclick="restart()">Rise Again</button></div>

  // Check if tapping in joystick area
  if(x<100&&y>H-160)return;
  for(var i=0;i<G.mobs.length;i++){var m=G.mobs[i];if(m.hp<=0)continue;var d=Math.sqrt((x-m.x)*(x-m.x)+(y-m.y)*(y-m.y));if(d<40){G.tm=m;atk();return;}}
  G.tx=x;G.ty=y;
}

function spawn(){
  G.mobs=[];G.tm=null;var z=ZONES[G.z];var cnt=2+Math.floor(Math.random()*3);var zo=[0,2,5][G.z];
  for(var i=0;i<cnt;i++){var t=z.en[Math.floor(Math.random()*z.en.length)];var el=G.lv+zo;
  G.mobs.push({n:t.n,e:t.e,boss:t.boss||false,lv:el,hp:Math.floor(t.hp*(1+el*.15)),mhp:Math.floor(t.hp*(1+el*.15)),a:Math.floor(t.a*(1+el*.1)),x:60+Math.random()*(W-120),y:40+Math.random()*(H*.4),xp:Math.floor(t.x*(1+el*.1)),g:Math.floor(t.g*(1+el*.08)),bt:Math.random()*6,si:i%MONSTERS.length});}
  if(G.mobs.length>0)G.tm=G.mobs[0];
}

function atk(){
  var m=G.tm;if(!m||m.hp<=0)return;
  var cr=Math.random()<G.cr;var dm=Math.max(1,G.a-(m.boss?5:0));if(cr)dm=Math.floor(dm*2);
  m.hp=Math.max(0,m.hp-dm);if(G.ls>0){G.hp=Math.min(G.mhp,G.hp+Math.floor(dm*G.ls/100));}
  sfx.hit();sDmg(m.x,m.y-20,'-'+dm,cr?'#f59e0b':'#ef4444');
  if(m.hp<=0){mDie(m);}else{eAtk(m);}hud();
}

function eAtk(m){
  if(!m)return;if(G.dodge>0&&Math.random()<G.dodge/100){sDmg(G.px,G.py-20,'DODGE','#60a5fa');return;}
  var dm=Math.max(1,m.a-G.d-(G.db||0));G.hp=Math.max(0,G.hp-dm);sfx.hurt();sDmg(G.px,G.py-20,'-'+dm,'#ef4444');
  if(G.hp<=0){sfx.die();document.getElementById('go').style.display='flex';document.getElementById('gs').textContent='Lv'+G.lv+' | '+G.g+'g | '+G.kills+' kills';}
  hud();
}

function mDie(m){
  sfx.kill();G.xp+=m.xp;G.g+=m.g;G.kills++;
  sDmg(m.x,m.y-30,'+'+m.xp+' XP','#f59e0b');
  while(G.xp>=G.xpn){G.lv++;G.xp-=G.xpn;G.xpn=G.lv*100;G.mhp+=10;G.hp=G.mhp;G.mmp+=5;G.mp=G.mmp;G.a+=2;G.d+=1;sfx.lvl();}
  if(Math.random()<.4)drop();
  var idx=G.mobs.indexOf(m);if(idx>-1)G.mobs.splice(idx,1);
  if(G.mobs.length===0)setTimeout(spawn,1500);else G.tm=G.mobs[0];
  hud();save();
}

function drop(){
  sfx.loot();var r=Math.random(),rar=RARS[0];var cu=0;for(var i=0;i<RARS.length;i++){cu+=RARS[i].ch;if(r<cu){rar=RARS[i];break;}}
  var ns=rar.n==='Common'||rar.n==='Uncommon'?2:rar.n==='Rare'||rar.n==='Epic'?3:4;
  var sp=['ATK','DEF','HP','MP','CRIT','SPD','DODGE','LS'];var st={};var pk=[];
  for(var s=0;s<ns;s++){var pl=sp.filter(function(x){return pk.indexOf(x)===-1;});var k=pl[Math.floor(Math.random()*pl.length)];pk.push(k);
  var v=Math.floor((2+G.lv*.3)*rar.m*(.8+Math.random()*.4));if(k==='CRIT'||k==='DODGE'||k==='LS'||k==='SPD')v=Math.max(1,Math.floor(v*.5));st[k]=v;}
  var sl=SLOTS[Math.floor(Math.random()*SLOTS.length)];
  var pre=PREF[Math.floor(Math.random()*PREF.length)];var base=(SNAMES[sl]||['Item'])[Math.floor(Math.random()*(SNAMES[sl]||['Item']).length)];
  var it={type:sl,name:pre+' '+base,rar:rar.n,col:rar.c,stats:st,tex:ICONS[Math.floor(Math.random()*ICONS.length)]};
  G.inv.push(it);
  var d=document.createElement('div');d.className='lp';
  var ss=bSS(it);d.innerHTML='<div style="font-size:9px;color:'+it.col+';letter-spacing:2px;">'+it.rar+'</div>'+(it.tex?'<img src="'+it.tex+'" style="width:40px;height:40px;object-fit:contain;margin:4px;">':'')+'<div style="font-size:13px;font-weight:700;color:'+it.col+';">'+it.name+'</div><div style="font-size:9px;color:#94a3b8;">'+ss+'</div>';
  document.body.appendChild(d);setTimeout(function(){d.remove();},2000);
}

function bSS(it){
  if(!it.stats)return'';var p=[];var s=it.stats;
  if(s.ATK)p.push('ATK+'+s.ATK);if(s.DEF)p.push('DEF+'+s.DEF);if(s.HP)p.push('HP+'+s.HP);if(s.MP)p.push('MP+'+s.MP);
  if(s.CRIT)p.push('CR+'+s.CRIT+'%');if(s.SPD)p.push('SP+'+s.SPD+'%');if(s.DODGE)p.push('DG+'+s.DODGE+'%');if(s.LS)p.push('LS+'+s.LS+'%');
  return p.join(' ');
}

function sDmg(x,y,t,c){var d=document.createElement('div');d.className='df';d.style.left=x+'px';d.style.top=y+'px';d.style.color=c||'#fff';d.textContent=t;document.getElementById('carea').appendChild(d);setTimeout(function(){d.remove();},800);}

function skill(i){
  if(i===6){togInv();return;}
  if(i===0){if(G.tm&&G.tm.hp>0)atk();return;}
  var c=CLS[G.cls];
  if(i>=1&&i<=3){var si=i-1;if(G.mp<c.sc[si])return;G.mp-=c.sc[si];var dm=c.sd[si];
    if(dm<0){G.hp=Math.min(G.mhp,G.hp+Math.abs(dm));sfx.lvl();sDmg(G.px,G.py-30,'+'+Math.abs(dm),'#4ade80');}
    else if(G.tm&&G.tm.hp>0){G.tm.hp=Math.max(0,G.tm.hp-dm);sfx.hit();sDmg(G.tm.x,G.tm.y-30,'-'+dm,'#c084fc');if(G.tm.hp<=0)mDie(G.tm);else eAtk(G.tm);}}
  if(i===4){if(G.mp<c.ac)return;G.mp-=c.ac;for(var ai=G.mobs.length-1;ai>=0;ai--){var m=G.mobs[ai];if(m.hp<=0)continue;m.hp=Math.max(0,m.hp-c.ad);sfx.hit();sDmg(m.x,m.y-20,'-'+c.ad,'#f59e0b');if(m.hp<=0)mDie(m);}}
  if(i===5){if(G.mp<c.dc)return;G.mp-=c.dc;G.db=c.da;G.dbt=300;sfx.lvl();sDmg(G.px,G.py-30,'+'+c.da+' DEF','#60a5fa');}
  hud();
}

function chZone(z){G.z=z;G.mobs=[];G.tm=null;document.querySelectorAll('.zbtn').forEach(function(b,i){b.classList.toggle('on',i===z);});spawn();}
function togInv(){document.getElementById('inv').classList.toggle('open');rInv();}
function togShop(){document.getElementById('shop').classList.toggle('open');rShop();}
function scoreIt(it){if(!it||!it.stats)return 0;var s=0;for(var k in it.stats){if(it.stats.hasOwnProperty(k)){var v=it.stats[k];s+=k==='CRIT'||k==='DODGE'||k==='LS'||k==='SPD'?v*5:v;}}return s;}
function eqAll(){var changed=false;for(var si=0;si<SLOTS.length;si++){var sl=SLOTS[si];var eq=G.eq[sl];var eqS=eq?scoreIt(eq):0;var best=-1;var bestS=eqS;
for(var j=0;j<G.inv.length;j++){if(G.inv[j].type===sl){var s=scoreIt(G.inv[j]);if(s>bestS){bestS=s;best=j;}}}
if(best>-1){eqIt(best);changed=true;}}if(!changed)sfx.hurt();}
var invTab='all';function sIT(t){invTab=t;rInv();}

function rInv(){
  var h='';
  // Equipped
  h+='<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:6px;">';
  var eqs=[['weapon','⚔️'],['offhand','🛡️'],['chest','👕'],['legs','👖'],['gloves','🧤'],['boots','👢'],['ring1','💍'],['ring2','💍'],['amulet','📿']];
  for(var i=0;i<eqs.length;i++){var e=eqs[i];var eq=G.eq[e[0]];
  h+='<div style="aspect-ratio:1;border-radius:4px;background:'+(eq?eq.col+'15':'#ffffff08')+';border:1px solid '+(eq?eq.col+'44':'#ffffff0f')+';display:flex;align-items:center;justify-content:center;overflow:hidden;">';
  if(eq&&eq.tex)h+='<img src="'+eq.tex+'" style="width:80%;height:80%;object-fit:contain;">';
  else h+='<span style="font-size:12px;opacity:0.3;">'+e[1]+'</span>';h+='</div>';}
  h+='</div>';
  // Recommend + Equip All
  var recs=0;for(var ri=0;ri<SLOTS.length;ri++){var sl=SLOTS[ri];var eq=G.eq[sl];var eqS=eq?scoreIt(eq):0;
    for(var rj=0;rj<G.inv.length;rj++){if(G.inv[rj].type===sl&&scoreIt(G.inv[rj])>eqS){recs++;break;}}}
  if(recs>0){h+='<div style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25);border-radius:6px;padding:4px 8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;"><span style="color:#f59e0b;font-size:9px;font-weight:700;">⭐ '+recs+' upgrades available</span><button onclick="eqAll()" style="padding:2px 8px;border-radius:4px;border:1px solid #f59e0b;background:rgba(245,158,11,0.15);color:#f59e0b;font-size:8px;font-weight:700;cursor:pointer;">EQUIP ALL</button></div>';}
  // Tabs
  h+='<div style="display:flex;gap:2px;margin-bottom:4px;overflow-x:auto;">';
  var tc={};for(var ti=0;ti<G.inv.length;ti++){var tt=G.inv[ti].type;tc[tt]=(tc[tt]||0)+1;}
  var tabs=[['all','All',G.inv.length],['weapon','⚔️',tc.weapon||0],['chest','👕',tc.chest||0],['boots','👢',tc.boots||0],['ring1','💍',(tc.ring1||0)+(tc.ring2||0)],['amulet','📿',tc.amulet||0]];
  for(var tj=0;tj<tabs.length;tj++){var tl=tabs[tj];
  h+='<button onclick="sIT(&quot;'+tl[0]+'&quot;)" style="padding:2px 5px;border-radius:4px;border:1px solid '+(invTab===tl[0]?'#7c3aed':'#222')+';background:'+(invTab===tl[0]?'#7c3aed22':'transparent')+';color:'+(invTab===tl[0]?'#c084fc':'#555')+';font-size:8px;cursor:pointer;">'+tl[1]+tl[2]+'</button>';}
  h+='</div>';
  // Items grid 10-wide
  var flt=[];for(var fi=0;fi<G.inv.length;fi++){var it=G.inv[fi];if(invTab==='all'||it.type===invTab||(invTab==='ring1'&&(it.type==='ring1'||it.type==='ring2')))flt.push({i:it,x:fi});}
  h+='<div style="display:grid;grid-template-columns:repeat(10,1fr);gap:2px;">';
  for(var gi=0;gi<flt.length;gi++){var it=flt[gi].i;var ix=flt[gi].x;
  h+='<div onclick="eqIt('+ix+')" style="aspect-ratio:1;border-radius:3px;background:'+it.col+'11;border:1px solid '+it.col+'44;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative;">';
  if(it.tex)h+='<img src="'+it.tex+'" style="width:85%;height:85%;object-fit:contain;">';
  else h+='<span style="font-size:10px;">⚔️</span>';
  h+='<span style="position:absolute;top:0;left:0;right:0;height:2px;background:'+it.col+';"></span>';
  h+='<span style="position:absolute;bottom:0;left:0;right:0;font-size:6px;color:#eee;font-weight:700;background:rgba(0,0,0,0.7);text-align:center;overflow:hidden;white-space:nowrap;">'+bSS(it).substring(0,14)+'</span>';
  h+='</div>';}
  h+='</div>';
  if(flt.length===0)h+='<div style="text-align:center;color:#444;padding:12px;font-size:10px;">Kill enemies for loot!</div>';
  document.getElementById('ic').innerHTML=h;
}

function eqIt(ix){
  var it=G.inv[ix];if(!it)return;var sl=it.type;if(G.eq[sl])G.inv.push(G.eq[sl]);G.eq[sl]=it;G.inv.splice(ix,1);
  var c=CLS[G.cls];G.a=c.a+(G.lv-1)*2;G.d=c.d+(G.lv-1);G.mhp=c.hp+(G.lv-1)*10;G.mmp=c.mp;G.cr=c.cr;G.spd=0;G.dodge=0;G.ls=0;
  for(var si=0;si<SLOTS.length;si++){var eq=G.eq[SLOTS[si]];if(eq&&eq.stats){var s=eq.stats;G.a+=(s.ATK||0);G.d+=(s.DEF||0);G.mhp+=(s.HP||0);G.mmp+=(s.MP||0);G.cr+=(s.CRIT||0)/100;G.spd+=(s.SPD||0);G.dodge+=(s.DODGE||0);G.ls+=(s.LS||0);}}
  if(G.hp>G.mhp)G.hp=G.mhp;sfx.loot();rInv();hud();save();
}

function rShop(){
  var h='<div style="color:#f59e0b;font-size:10px;margin-bottom:6px;">Gold: '+G.g+'</div>';
  h+='<div onclick="buyP(&quot;hp&quot;)" style="padding:8px;border:1px solid #333;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:11px;">❤️ HP Potion (25g) — x'+G.pot.hp+'</div>';
  h+='<div onclick="buyP(&quot;mp&quot;)" style="padding:8px;border:1px solid #333;border-radius:6px;cursor:pointer;font-size:11px;">💙 MP Potion (20g) — x'+G.pot.mp+'</div>';
  document.getElementById('sc').innerHTML=h;
}
function buyP(t){if(t==='hp'&&G.g>=25){G.g-=25;G.pot.hp++;sfx.loot();}else if(t==='mp'&&G.g>=20){G.g-=20;G.pot.mp++;sfx.loot();}rShop();hud();}

function hud(){
  document.getElementById('hpb').style.width=Math.max(0,(G.hp/G.mhp)*100)+'%';document.getElementById('hpt').textContent='HP '+G.hp+'/'+G.mhp;
  document.getElementById('mpb').style.width=Math.max(0,(G.mp/G.mmp)*100)+'%';document.getElementById('mpt').textContent='MP '+G.mp+'/'+G.mmp;
  document.getElementById('xpb').style.width=Math.max(0,(G.xp/G.xpn)*100)+'%';document.getElementById('xpt').textContent='XP '+G.xp+'/'+G.xpn;
  document.getElementById('gd').textContent=G.g+'g';document.getElementById('lv').textContent='Lv'+G.lv;
  var tgt=document.getElementById('tgt');
  if(G.tm&&G.tm.hp>0){tgt.style.display='block';document.getElementById('tgn').textContent='Lv'+G.tm.lv+' '+G.tm.n;document.getElementById('tgh').style.width=Math.max(0,(G.tm.hp/G.tm.mhp)*100)+'%';}
  else{tgt.style.display='none';}
}

function restart(){G.hp=G.mhp;G.mp=G.mmp;G.mobs=[];G.tm=null;document.getElementById('go').style.display='none';spawn();}

// RENDER
function loop(){
  if(G.hp<=0){requestAnimationFrame(loop);return;}
  tick++;ctx.clearRect(0,0,W,H);
  // Map background
  ctx.fillStyle=ZONES[G.z].bg;ctx.fillRect(0,0,W,H);
  var mapI=gImg(MAPS[G.z%3]);if(mapI.complete&&mapI.naturalWidth>0){ctx.globalAlpha=0.8;try{for(var _tx=0;_tx<W;_tx+=256){for(var _ty=0;_ty<H;_ty+=256){ctx.drawImage(mapI,_tx,_ty,256,256);}}}catch(e){}ctx.globalAlpha=1;}
  // BG overlay removed
  // Joystick movement
  if(joy.active&&joy.dist>0.1){var sp=3+G.spd*0.5;G.px+=joy.dx*sp;G.py+=joy.dy*sp;G.px=Math.max(20,Math.min(W-20,G.px));G.py=Math.max(20,Math.min(H-20,G.py));}
  else{var dx=G.tx-G.px,dy=G.ty-G.py;var d=Math.sqrt(dx*dx+dy*dy);if(d>3){G.px+=dx/d*3;G.py+=dy/d*3;}}
  // Player sprite
  var pby=G.py+Math.sin(tick*.05)*2;
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(G.px,pby+38,18,5,0,0,Math.PI*2);ctx.fill();
  var pI=gImg(PLAYERS[{warrior:0,mage:1,rogue:2,paladin:3}[G.cls]||0]);if(pI.complete&&pI.naturalWidth>0){var _pFW=Math.floor(pI.naturalWidth/4);var _pFH=Math.floor(pI.naturalHeight/8);var _pFr=Math.floor(tick/8)%4;try{ctx.drawImage(pI,_pFr*_pFW,0,_pFW,_pFH,G.px-32,pby-48,64,96);}catch(e){}}else{ctx.fillStyle='#c084fc';ctx.beginPath();ctx.arc(G.px,pby,16,0,Math.PI*2);ctx.fill();}
  // Mobs
  for(var mi=0;mi<G.mobs.length;mi++){
    var m=G.mobs[mi];if(m.hp<=0)continue;
    m.bt+=.03;var mby=m.y+Math.sin(m.bt)*3;
    // Target ring
    if(m===G.tm){ctx.strokeStyle='rgba(255,200,0,'+(0.5+Math.sin(tick*.1)*.3)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(m.x,mby,m.boss?36:24,0,Math.PI*2);ctx.stroke();}
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(m.x,mby+(m.boss?44:28),m.boss?22:14,m.boss?6:4,0,0,Math.PI*2);ctx.fill();
    // Sprite
    var mI=gImg(MONSTERS[m.si%4]);var ms=m.boss?72:48;var mh=m.boss?108:72;if(mI.complete&&mI.naturalWidth>0){var _mFW=Math.floor(mI.naturalWidth/4);var _mFH=Math.floor(mI.naturalHeight/8);var _mFr=Math.floor(tick/10)%4;try{ctx.drawImage(mI,_mFr*_mFW,0,_mFW,_mFH,m.x-ms/2,mby-mh/2,ms,mh);}catch(e){}}
    else{ctx.fillStyle='#fff';ctx.font=(m.boss?'28':'18')+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(m.e,m.x,mby);}
    // HP bar
    var bw=m.boss?70:50;ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(m.x-bw/2,mby-mh/2-10,bw,6);
    ctx.fillStyle=m.hp/m.mhp>.5?'#4ade80':m.hp/m.mhp>.25?'#f59e0b':'#ef4444';
    ctx.fillRect(m.x-bw/2,mby-mh/2-10,bw*(m.hp/m.mhp),6);
    // Name
    ctx.fillStyle='#ccc';ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.fillText('Lv'+m.lv+' '+m.n,m.x,mby-mh/2-14);
  }
  // Auto attack
  G.at++;if(G.at>72&&G.tm&&G.tm.hp>0){var ad=Math.sqrt((G.px-G.tm.x)*(G.px-G.tm.x)+(G.py-G.tm.y)*(G.py-G.tm.y));if(ad<100){atk();G.at=0;}}
  // Def buff
  if(G.dbt>0){G.dbt--;if(G.dbt<=0)G.db=0;}
  // Minimap
  var mc=document.getElementById('mmc').getContext('2d');mc.clearRect(0,0,60,60);mc.fillStyle=ZONES[G.z].bg;mc.fillRect(0,0,60,60);
  mc.fillStyle='#c084fc';mc.beginPath();mc.arc(G.px/W*60,G.py/H*60,3,0,Math.PI*2);mc.fill();
  for(var ri=0;ri<G.mobs.length;ri++){if(G.mobs[ri].hp<=0)continue;mc.fillStyle=G.mobs[ri]===G.tm?'#f59e0b':'#ef4444';mc.beginPath();mc.arc(G.mobs[ri].x/W*60,G.mobs[ri].y/H*60,2,0,Math.PI*2);mc.fill();}
  requestAnimationFrame(loop);
}

function save(){try{localStorage.setItem('sr9',JSON.stringify({cls:G.cls,z:G.z,hp:G.hp,mhp:G.mhp,mp:G.mp,mmp:G.mmp,xp:G.xp,xpn:G.xpn,lv:G.lv,g:G.g,a:G.a,d:G.d,cr:G.cr,inv:G.inv,eq:G.eq,pot:G.pot,kills:G.kills}));}catch(e){}}
function load(){try{var s=localStorage.getItem('sr9');if(s){var d=JSON.parse(s);if(d.cls===G.cls){for(var k in d)if(d.hasOwnProperty(k))G[k]=d[k];hud();}}}catch(e){}}
</script>
</body>
</html>
